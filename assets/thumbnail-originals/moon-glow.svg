<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- 自作サムネイル素材: 月の象徴図形（T162自作図形） -->
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe8" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#f5e6a2" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- 外側の光彩 -->
  <circle cx="150" cy="150" r="140" fill="url(#moonGlow)"/>
  <!-- 月本体 -->
  <circle cx="150" cy="150" r="85" fill="#fdfae5"/>
  <!-- クレーターの抽象幾何 -->
  <circle cx="130" cy="130" r="14" fill="#eedc9a" opacity="0.5"/>
  <circle cx="175" cy="140" r="18" fill="#eedc9a" opacity="0.4"/>
  <circle cx="145" cy="180" r="22" fill="#eedc9a" opacity="0.45"/>
  <circle cx="180" cy="185" r="10" fill="#eedc9a" opacity="0.35"/>
</svg>
